name: Windows and Linux compatibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-secret-key-at-least-32-characters
      DATABASE_URL: sqlite:///ci-smoke.db
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: ci-only-admin-password
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run backend and native runtime tests
        run: python -m unittest discover -s tests -v
      - name: Apply migrations to a fresh database
        run: python -m flask --app run.py db upgrade
      - name: Seed initial data
        run: python -m flask --app run.py seed
      - name: Check shared WSGI server
        run: python -m waitress --help

  frontend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
